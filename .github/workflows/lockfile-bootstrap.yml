name: Lockfile Bootstrap

on:
  push:
    branches:
      - agent/service-desk-foundation
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  commit-lockfile:
    name: Commit Angular lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/service-desk-foundation

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Generate lockfile
        working-directory: client/ticketing-web
        run: npm install --package-lock-only --no-fund --no-audit

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/ticketing-web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Add Angular package lockfile"
            git push origin HEAD:agent/service-desk-foundation
          fi
