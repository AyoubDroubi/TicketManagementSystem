name: Migration Guard

on:
  pull_request:
    paths:
      - 'src/Ticketing.Domain/**'
      - 'src/Ticketing.Infrastructure/**'
      - 'src/Ticketing.Api/**'
      - '.github/workflows/migration-bootstrap.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Ticketing.Domain/**'
      - 'src/Ticketing.Infrastructure/**'
      - 'src/Ticketing.Api/**'
      - '.github/workflows/migration-bootstrap.yml'

permissions:
  contents: read

jobs:
  migration-guard:
    name: Verify EF migration is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore
        run: dotnet restore TicketManagementSystem.V2.slnx

      - name: Install EF CLI
        run: dotnet tool install --tool-path ./.tools dotnet-ef --version 10.0.4

      - name: Verify no pending model changes
        env:
          ConnectionStrings__TicketingDatabase: Host=localhost;Database=ticketing_design
        run: ./.tools/dotnet-ef migrations has-pending-model-changes --project src/Ticketing.Infrastructure/Ticketing.Infrastructure.csproj --startup-project src/Ticketing.Api/Ticketing.Api.csproj --context TicketingDbContext
