name: Migration Bootstrap

on:
  pull_request:
    paths:
      - 'src/Ticketing.Domain/**'
      - 'src/Ticketing.Infrastructure/**'
      - 'src/Ticketing.Api/**'
      - '.github/workflows/migration-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate EF migration artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore
        run: dotnet restore TicketManagementSystem.V2.slnx

      - name: Install EF CLI
        run: dotnet tool install --tool-path ./.tools dotnet-ef --version 10.0.4

      - name: Generate initial migration
        env:
          ConnectionStrings__TicketingDatabase: Host=localhost;Database=ticketing_design
        run: ./.tools/dotnet-ef migrations add InitialV2 --project src/Ticketing.Infrastructure/Ticketing.Infrastructure.csproj --startup-project src/Ticketing.Api/Ticketing.Api.csproj --context TicketingDbContext --output-dir Persistence/Migrations

      - name: Upload migration
        uses: actions/upload-artifact@v7
        with:
          name: ticketing-initial-migration
          path: src/Ticketing.Infrastructure/Persistence/Migrations
          retention-days: 1
          if-no-files-found: error
